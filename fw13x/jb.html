<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ATARI SHERWAN | GoldHEN</title>

<!--
فایلەکانی exploit هەر لە fw13x وەردەگیرێن،
هەرچەندە URL ـەکە لە address bar کورت دەکەینەوە.
-->
<base href="/goldhen/fw13x/">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

.hero{
    width:100%;
    height:100%;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:0 24px 7vh;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.02),
            rgba(0,0,0,.18)
        ),
        url("../atari_sherwan.png")
        center center / cover no-repeat;
}

#status{
    min-width:360px;
    padding:20px 52px;

    border:2px solid #ffd21a;
    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(43,32,3,.94),
            rgba(3,3,3,.97)
        );

    color:#fff;
    text-align:center;
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;

    box-shadow:
        0 0 13px #ffcf00,
        0 0 38px rgba(255,190,0,.62),
        inset 0 0 22px rgba(255,190,0,.14);

    text-shadow:
        0 0 10px rgba(255,210,0,.65);
}

.success,
.failed{
    display:none;
}

body.done #status .loading{
    display:none;
}

body.done #status .success{
    display:inline;
}

body.fail #status .loading{
    display:none;
}

body.fail #status .failed{
    display:inline;
}

body.done #status{
    border-color:#fff;
}

body.fail #status{
    border-color:#ff5555;
}

/* jb.js پێویستی بە state و out هەیە */
#state,
#out{
    position:absolute;
    left:-99999px;
    top:-99999px;
    width:1px;
    height:1px;
    overflow:hidden;
}

/* تەنها بۆ ?log=1 */
#debug{
    display:none;
}

body.log{
    overflow:auto;
}

body.log .hero{
    display:none;
}

body.log #debug{
    display:block;
    padding:18px;
    background:#000;
    color:#ddd;
    min-height:100vh;
}

body.log #state{
    position:static;
    width:auto;
    height:auto;
    overflow:visible;
    font-size:22px;
    font-weight:bold;
    color:#ffd21a;
    margin-bottom:15px;
}

body.log #out{
    position:static;
    width:auto;
    height:auto;
    overflow:visible;
    white-space:pre-wrap;
    font:12px/1.45 monospace;
}

.ok{color:#7fd0a0}
.warn{color:#ffd21a}
.bad{color:#ff7777}

@media(max-width:600px){
    #status{
        min-width:270px;
        padding:16px 28px;
        font-size:20px;
    }
}
</style>
</head>

<body>

<main class="hero">

    <div id="status">

        <span class="loading">
            LOADING GOLDHEN...
        </span>

        <span class="success">
            GOLDHEN LOADED ✓
        </span>

        <span class="failed">
            GOLDHEN FAILED
        </span>

    </div>

</main>

<div id="debug">
    <div id="state">LOADING GOLDHEN...</div>
    <div id="out"></div>
</div>

<script>
(function(){

    /*
    fw13x/jb.html لە address bar لادەبات.
    ?log=1 یان هەر parameter ـێک هەبێت پارێزراو دەبێت.
    */

    try{

        var clean =
            "/goldhen/" +
            location.search +
            location.hash;

        history.replaceState(
            null,
            "",
            clean
        );

    }catch(e){}

})();
</script>

<script type="module">
import "./jb.js?v=10";
</script>

</body>
</html>
